<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>現場進捗管理・最終データ統合</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#F4F7FB;color:#2D3748;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}.wrap{max-width:720px;margin:36px auto;padding:0 16px}.card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.09);padding:24px}.title{color:#1F4E79;font-size:22px;margin:0 0 8px}.notice{background:#FFF9E6;border:1px solid #F6D365;border-radius:9px;padding:12px;margin:16px 0;font-size:14px}.info{display:none;background:#F0F7FF;border:1px solid #90CDF4;border-radius:9px;padding:12px;margin:14px 0;white-space:pre-wrap}.result{display:none;border-radius:9px;padding:12px;margin-top:14px;white-space:pre-wrap}.result.ok{background:#F0FFF4;border:1px solid #9AE6B4;color:#276749}.result.error{background:#FFF5F5;border:1px solid #FEB2B2;color:#C53030}.btn{border:0;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer}.btn-primary{background:#1F4E79;color:#fff}.btn-primary:disabled{background:#A0AEC0;cursor:not-allowed}.btn-secondary{background:#EDF2F7;color:#4A5568;margin-left:8px}input[type=file]{display:block;width:100%;margin:14px 0;padding:10px;border:1px solid #CBD5E0;border-radius:8px;background:#fff}.small{font-size:12px;color:#718096;margin-top:16px}
  </style>
</head>
<body>
  <main class="wrap"><section class="card">
    <h1 class="title">🔄 旧アプリ最終データの統合</h1>
    <p>旧アプリから保存したJSONを、新システムへ一度だけ安全に統合します。</p>
    <div class="notice">新システムで作成したAIタスク・写真・書類は残します。旧アプリと新システムの両方で同じ内容を変更していた場合は、自動上書きをせずに一覧で知らせます。</div>
    <input id="json-file" type="file" accept=".json,application/json">
    <div id="file-info" class="info"></div>
    <button id="merge-btn" class="btn btn-primary" disabled>このJSONを統合する</button>
    <button class="btn btn-secondary" onclick="location.href='pilot.html'">戻る</button>
    <div id="result" class="result"></div>
    <p class="small">統合の実行には、社長アカウントでログイン済みであることが必要です。</p>
  </section></main>
  <script>
  const API='https://kanri-api.kagunyan.com/public/api/index.php';
  const TOKEN_KEY='kanri_pilot_access_token';
  let snapshot=null;
  const fileInput=document.getElementById('json-file'),info=document.getElementById('file-info'),button=document.getElementById('merge-btn'),result=document.getElementById('result');
  function showResult(message,ok=false){result.className='result '+(ok?'ok':'error');result.style.display='block';result.textContent=message;}
  fileInput.addEventListener('change',async()=>{
    result.style.display='none';snapshot=null;button.disabled=true;info.style.display='none';
    const file=fileInput.files[0];if(!file)return;
    try{
      const data=JSON.parse(await file.text());
      if(!Array.isArray(data.sites)||!Array.isArray(data.reports))throw new Error('現場・日報データが見つかりません。');
      snapshot=data;info.style.display='block';info.textContent=`確認しました\n現場：${data.sites.length}件\n日報：${data.reports.length}件\n書き出し日時：${data.exportedAt||'不明'}`;button.disabled=false;
    }catch(e){showResult('JSONを読み取れませんでした。旧アプリの「データ保存」で作成したファイルを選んでください。');}
  });
  button.addEventListener('click',async()=>{
    if(!snapshot)return;
    const token=localStorage.getItem(TOKEN_KEY)||'';
    if(!token){showResult('ログイン情報がありません。pilot.htmlで社長としてログインしてから、もう一度この画面を開いてください。');return;}
    if(!confirm('最終データを統合します。統合中は画面を閉じないでください。'))return;
    button.disabled=true;button.textContent='統合中…';
    try{
      const response=await fetch(API+'/admin/merge-gist-snapshot',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(snapshot)});
      const body=await response.json().catch(()=>({}));if(!response.ok||body.ok===false)throw new Error(body.error||'統合に失敗しました。');
      const r=body.result||{};let text=`統合が完了しました。\n\n現場：追加 ${r.sitesAdded||0}件／更新 ${r.sitesUpdated||0}件\n日報：追加 ${r.reportsAdded||0}件／更新 ${r.reportsUpdated||0}件\n新システムに既にあった日報：${r.reportsAlreadyPresent||0}件`;
      if((r.conflicts||[]).length)text+=`\n\n自動上書きをしなかった要確認項目：${r.conflicts.length}件\n`+(r.conflicts||[]).map(x=>`・${x.type} ${x.name}：${x.reason}`).join('\n');
      else text+='\n\n競合はありません。pilot.htmlへ戻り、現場・日報を確認してください。';
      showResult(text,true);
    }catch(e){showResult('統合できませんでした：'+e.message);}
    finally{button.disabled=false;button.textContent='このJSONを統合する';}
  });
  </script>
</body>
</html>
